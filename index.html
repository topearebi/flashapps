<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <!-- interactive-widget=resizes-content prevents mobile keyboards from breaking viewport layouts -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <meta name="description" content="Zero-friction, deterministic rapid script and vocabulary recall engine." />
  <meta name="theme-color" content="#090d16" />

  <!-- PWA & Capability Manifests -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <title>SpeedRecall</title>

  <!-- Modular Stylesheet Cascade -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/stage.css" />
  <link rel="stylesheet" href="css/drawer.css" />
</head>
<body>
  <!-- Root Container with Safe Area & TV Overscan Insets -->
  <div id="app" class="app-viewport">
    
    <!-- Top Persistent Control Bar -->
    <header class="app-header" role="banner">
      <div class="deck-selector-group">
        <label for="deckSelect" class="sr-only">Select Deck</label>
        <select id="deckSelect" class="nav-interactive" aria-label="Select active deck">
          <!-- Populated dynamically from storage -->
        </select>
        
        <label for="modeSelect" class="sr-only">Evaluation Mode</label>
        <select id="modeSelect" class="nav-interactive" aria-label="Select evaluation mode">
          <option value="pinyin-number">Pinyin (Number: hao3)</option>
          <option value="pinyin-plain">Pinyin (Plain: hao)</option>
          <option value="pinyin-tone">Pinyin (Tone: hǎo)</option>
          <option value="latin-clean">Latin Clean (No accents)</option>
          <option value="strict">Strict Literal</option>
        </select>
      </div>

      <div class="header-actions">
        <button 
          id="btnToggleDrawer" 
          class="btn-icon nav-interactive" 
          aria-haspopup="dialog" 
          aria-expanded="false" 
          aria-controls="drawerDialog"
          title="Open Categories & Settings (Ctrl/Cmd + O)"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span class="sr-only">Filters & Datasets</span>
        </button>
      </div>
    </header>

    <!-- Main Flash Arena / Review Stage -->
    <main class="review-stage" role="main">
      <div class="stats-ribbon" role="status" aria-live="off">
        <div class="stat-item">
          <span class="stat-label">Accuracy:</span>
          <span id="statAccuracy" class="stat-value">0%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Streak:</span>
          <span id="statStreak" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Active Pool:</span>
          <span id="statPoolSize" class="stat-value">0</span>
        </div>
      </div>

      <!-- Core Display Card (ARIA Polite for Dynamic Screen Reader Updates) -->
      <section id="flashcard" class="card-display" aria-live="polite" aria-atomic="true">
        <div id="cardPrompt" class="prompt-text" lang="und">--</div>
        <div id="cardSubtitle" class="prompt-subtitle">Select categories to begin</div>
      </section>

      <!-- Low-Friction Instant Keystroke Target -->
      <div class="input-container">
        <input 
          type="text" 
          id="recallInput" 
          class="keystroke-input nav-interactive"
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false" 
          inputmode="text"
          enterkeyhint="go"
          aria-label="Type your answer"
          placeholder="Type answer..."
          autofocus 
        />
      </div>

      <!-- Accessible Feedback Region (Assertive on Failures) -->
      <div id="feedbackRegion" class="feedback-banner" role="alert" aria-live="assertive"></div>
    </main>

    <!-- DJT Kana Style Dynamic Selection Drawer (Modal Dialog) -->
    <dialog id="drawerDialog" class="filter-drawer" aria-labelledby="drawerTitle">
      <div class="drawer-inner">
        <header class="drawer-header">
          <h2 id="drawerTitle">Categories & Decks</h2>
          <button id="btnCloseDrawer" class="btn-icon nav-interactive" aria-label="Close categories">✕</button>
        </header>

        <section class="drawer-body">
          <!-- Dynamic Unit Matrix auto-populated from card dataset -->
          <fieldset class="matrix-container">
            <legend class="matrix-legend">Select Rows / Columns to Practice</legend>
            <div class="matrix-actions">
              <button type="button" id="btnSelectAllUnits" class="btn-sm nav-interactive">Select All</button>
              <button type="button" id="btnDeselectAllUnits" class="btn-sm nav-interactive">Deselect All</button>
            </div>
            <div id="unitCheckboxesGrid" class="units-grid">
              <!-- Dynamically mapped checkboxes inject here -->
            </div>
          </fieldset>

          <!-- Raw Data / Delimited TSV Importer -->
          <details class="accordion-section">
            <summary class="nav-interactive">Batch Import (TSV / Plain Text)</summary>
            <div class="accordion-content">
              <p class="helper-text">Format: <code>Group [tab] Unit [tab] Prompt [tab] Subtitle [tab] Answer(s)</code></p>
              <textarea id="tsvInputArea" class="raw-tsv-input" rows="5" placeholder="HSK 1	Pronouns	你	you	ni3,ni&#10;HSK 1	Pronouns	好	good	hao3,hao"></textarea>
              <button type="button" id="btnImportTSV" class="btn-primary nav-interactive">Append to Current Deck</button>
            </div>
          </details>

          <!-- Backup & Migration Actions -->
          <div class="storage-actions">
            <button type="button" id="btnExportJSON" class="btn-secondary nav-interactive">Export Decks (JSON)</button>
            <label class="btn-secondary file-label nav-interactive">
              Import Decks (JSON)
              <input type="file" id="inputFileJSON" accept=".json" class="sr-only" />
            </label>
            <button type="button" id="btnResetDefaults" class="btn-danger nav-interactive">Reset to Defaults</button>
          </div>
        </section>
      </div>
    </dialog>

  </div>

  <!-- Application Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .catch((err) => console.warn("SW registration error:", err));
      });
    }
  </script>
</body>
</html>
